<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>植物环境信号 · 论文雷达 Paper Radar</title>
<style>
:root{
  --green:#2e7d32; --green-d:#1b5e20; --green-l:#e8f5e9;
  --bg:#f4f7f4; --card:#ffffff; --ink:#1f2d24; --ink2:#5c6f63; --line:#dfe7e0;
  --amber:#e65100; --blue:#1565c0; --red:#b71c1c;
  --shadow:0 1px 3px rgba(30,60,40,.08),0 4px 14px rgba(30,60,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:var(--green-d)}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px 60px}

/* ---------- header ---------- */
header{background:linear-gradient(135deg,#1b5e20 0%,#2e7d32 55%,#43a047 100%);color:#fff;padding:26px 0 18px;box-shadow:var(--shadow)}
header .wrap{padding-bottom:0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:26px;font-weight:700;letter-spacing:.5px}
.brand .en{font-size:13px;opacity:.85;font-weight:400}
.byline{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:3px 14px;font-size:13px;font-weight:500;backdrop-filter:blur(2px);white-space:nowrap}
.byline a{color:#fff;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.6)}
.byline a:hover{opacity:.85}
.sub{font-size:13px;opacity:.9;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 12px;font-size:12.5px;backdrop-filter:blur(2px)}
.chip b{font-size:14px}

/* ---------- control bar ---------- */
.ctrl{position:sticky;top:0;z-index:50;background:rgba(244,247,244,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 0 8px;transition:transform .28s ease,box-shadow .28s ease}
.ctrl.hide{transform:translateY(-108%)}
.backtop{position:fixed;bottom:26px;right:22px;z-index:60;width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(27,94,32,.35);opacity:0;pointer-events:none;transition:opacity .22s}
.backtop.show{opacity:1;pointer-events:auto}
.jmeta{font-size:11px;color:#5c6f63;border:1px solid var(--line);background:#fafcfa;border-radius:8px;padding:0 7px}
.backtop:hover{background:var(--green-d)}

/* ---------- 划词快搜 ---------- */
.selbtn{position:fixed;z-index:80;border:1px solid var(--green);background:#fff;color:var(--green-d);border-radius:8px;padding:5px 13px;font-size:13px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.selbtn:hover{background:var(--green-l)}
.srch{position:fixed;inset:0;background:rgba(15,35,20,.45);z-index:90;display:flex;justify-content:center;align-items:flex-start;padding:7vh 14px}
.srch-box{background:#fff;border-radius:14px;width:100%;max-width:760px;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.srch-head{display:flex;gap:8px;padding:14px 16px 8px}
.srch-head input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;outline:none}
.srch-head input:focus{border-color:var(--green)}
.ext-row{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink2)}
.srch-res{overflow-y:auto;padding:4px 16px 16px;border-top:1px solid var(--line)}
.mcard{padding:10px 4px;border-bottom:1px dashed var(--line);font-size:0}
.mcard .badge{margin-right:8px}
.mcard .mdate{font-size:12px;color:var(--ink2);margin:0 8px}
.mcard .stars{margin-left:4px}
.mti{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-top:5px;text-decoration:none;line-height:1.4}
.mti:hover{color:var(--green-d);text-decoration:underline}
.mau{font-size:12px;color:var(--ink2);margin-top:3px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.flt-toggle{display:none}
.tab{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 16px;font-size:14px;cursor:pointer;color:var(--ink2);transition:all .15s}
.tab:hover{border-color:var(--green)}
.tab.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=text]{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13.5px;background:#fff;outline:none}
.filters input[type=text]:focus{border-color:var(--green)}
.filters select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;background:#fff;color:var(--ink);outline:none;cursor:pointer}
.jchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.jc{font-size:11.5px;padding:2px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink2);user-select:none;transition:all .12s}
.jc.on{color:#fff;border-color:transparent}
.jc.on[data-j="__all"]{background:var(--green)}
.count-line{font-size:12.5px;color:var(--ink2);margin:10px 2px 0}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;box-shadow:var(--shadow);position:relative}
.card .fig{position:absolute;top:44px;right:14px;width:132px;max-height:120px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;box-shadow:0 2px 8px rgba(30,60,40,.12);background:#fff}
.has-fig .title,.has-fig .tags{margin-right:146px}
.tr-panel{border-left-color:#7986cb;background:#f7f8fd}
.tr-ti{margin-bottom:6px}
.tr-ab{white-space:pre-wrap}
@media(max-width:720px){.card .fig{width:92px;max-height:88px;top:40px}.has-fig .title,.has-fig .tags{margin-right:100px}}
.chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.badge{color:#fff;font-weight:700;font-size:11px;border-radius:5px;padding:2px 8px;letter-spacing:.3px}
.chead .date{color:var(--ink2)}
.spacer{flex:1}
.stars{font-size:12px;font-weight:600;padding:2px 10px;border-radius:12px}
.t3{background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7}
.t2{background:#fff8e1;color:#8d6e00;border:1px solid #ffe082}
.t1{background:#f5f5f5;color:#757575;border:1px solid #e0e0e0}
.t0{background:#fafafa;color:#b0b0b0;border:1px dashed #ddd}
.title{display:block;font-size:15.5px;font-weight:600;color:var(--ink);margin-top:7px;text-decoration:none;line-height:1.45}
.title:hover{color:var(--green-d);text-decoration:underline}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11px;background:var(--green-l);color:var(--green-d);border:1px solid #c8e6c9;border-radius:10px;padding:1px 9px}
.authors{font-size:13px;color:var(--ink2);margin-top:7px}
.btnrow{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.lbtn{font-size:12.5px;border:1px solid var(--line);background:#fafcfa;border-radius:7px;padding:3px 12px;cursor:pointer;color:var(--green-d)}
.lbtn:hover{border-color:var(--green);background:var(--green-l)}
.hidden{display:none}
.panel{margin-top:9px;border-left:3px solid #c8e6c9;background:#fbfdfb;padding:10px 13px;border-radius:0 8px 8px 0;font-size:13.5px;color:#33443a;white-space:pre-wrap}
.panel .aff{padding:1px 0}
.meta-links{margin-top:9px;font-size:12px;color:#8aa092}
.meta-links a{color:var(--blue);text-decoration:none;margin-right:14px}
.meta-links a:hover{text-decoration:underline}
.loading{color:var(--ink2);font-size:13px;padding:6px 0}

/* ---------- trend ---------- */
.trend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.trend h3{font-size:14.5px;margin-bottom:4px}
.trend .legend{font-size:12px;color:var(--ink2);margin-bottom:10px}
.trend .lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px}
.tbars{display:flex;align-items:flex-end;gap:3px;height:110px;border-bottom:1px solid var(--line);padding-bottom:2px;overflow-x:auto}
.tcol{flex:1;min-width:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;height:100%}
.tb{width:70%;border-radius:2px 2px 0 0}
.tb.n{background:#a5d6a7}
.tb.s{background:#1b5e20}
.txlab{display:flex;gap:3px;margin-top:4px;overflow:hidden}
.tcol span{font-size:9.5px;color:var(--ink2);transform:rotate(-45deg);white-space:nowrap}

/* ---------- about ---------- */
.about{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-top:14px;box-shadow:var(--shadow);font-size:14px}
.about h3{margin:18px 0 8px;color:var(--green-d);font-size:15.5px}
.about h3:first-child{margin-top:0}
.about p,.about li{color:#3a4a40;font-size:13.8px}
.about ul{padding-left:20px;margin:6px 0}
.about code{background:#eef4ef;border-radius:4px;padding:1px 6px;font-size:12.5px}
.about pre{background:#12241a;color:#d7f0d7;border-radius:8px;padding:14px;overflow-x:auto;font-size:12px;line-height:1.55;margin:8px 0}
.about table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
.about th,.about td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.about th{background:var(--green-l);color:var(--green-d)}
.scoretbl td:first-child{white-space:nowrap}

/* ---------- misc ---------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;border-radius:8px;padding:9px 20px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw}
.empty{ text-align:center;color:var(--ink2);padding:50px 0;font-size:14px}
.pager{display:flex;gap:6px;justify-content:center;margin:22px 0 6px;flex-wrap:wrap}
.pg{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 13px;font-size:13px;cursor:pointer;color:var(--ink2)}
.pg.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
footer{text-align:center;color:#9ab0a0;font-size:12px;margin-top:36px}
@media (max-width:720px){
  /* 头部紧凑化 */
  header{padding:16px 0 12px}
  .brand{display:block}
  .brand h1{font-size:20px;letter-spacing:.2px}
  .brand .en{font-size:11.5px;display:block;margin-top:2px}
  .byline{display:inline-flex;margin-top:8px;font-size:12px;padding:2px 11px}
  .sub{font-size:12px;margin-top:5px;line-height:1.5}
  .stats{margin-top:10px;gap:6px}
  .chip{padding:2px 10px;font-size:11.5px}
  .chip b{font-size:13px}

  /* 控制条：搜索/筛选默认收起，加折叠切换按钮 */
  .ctrl{padding:8px 0 6px}
  .filters{display:none}
  .filters.open{display:flex;margin-top:6px}
  .filters input[type=text]{min-width:0;width:100%;flex:1 1 100%}
  .filters select{flex:1 1 auto;font-size:12.5px}
  .flt-toggle{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;border:1px dashed var(--green);background:var(--green-l);color:var(--green-d);border-radius:16px;padding:4px 13px;cursor:pointer;user-select:none;margin:2px 0 2px}
  .flt-toggle:active{opacity:.7}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;white-space:nowrap;font-size:13px;padding:5px 14px}
  .jchips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .jchips::-webkit-scrollbar{display:none}
  .jc{flex:0 0 auto;white-space:nowrap}
  .count-line{font-size:12px}

  /* 卡片布局 */
  .card{padding:12px 12px;border-radius:10px}
  .title{font-size:14.5px}
  .authors{font-size:12.5px}
  .btnrow{gap:6px}
  .lbtn{font-size:12px;padding:4px 11px}
  .card .fig{width:84px;max-height:82px;top:38px;right:12px}
  .has-fig .title,.has-fig .tags{margin-right:92px}
  .chead{gap:6px}

  /* 弹窗搜索浮层全屏化，贴合手机操作 */
  .srch{padding:0;align-items:flex-end}
  .srch-box{max-width:none;max-height:92vh;border-radius:16px 16px 0 0;width:100%}
  .srch-head{padding:14px 14px 8px}
  .srch-head input{font-size:16px}
  .ext-row{padding:0 14px 10px;gap:6px}
  .ext-row a{padding:4px 9px;border:1px solid var(--line);border-radius:6px}
  .srch-res{padding:4px 14px 20px}

  /* 划词按钮适配触摸 */
  .selbtn{font-size:13px;padding:6px 14px}

  /* 回到顶部按钮适配，避免遮挡 */
  .backtop{width:40px;height:40px;bottom:18px;right:16px;font-size:16px}

  /* 页脚与关于页 */
  footer{font-size:11.5px;padding:0 8px}
  .about{padding:14px}
  .about table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .wrap{padding:0 12px 48px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand"><h1>🌿 植物环境信号 · 论文雷达</h1><span class="en">Paper Radar for Plant–Environment Signaling</span><span class="byline">👤 作者：<a href="mailto:huangzc@jxust.edu.cn">huangzc@jxust.edu.cn</a></span></div>
    <div class="sub">环境信号 → 植物激素 → 转录因子 → 生长发育：9 大期刊近三年论文自动追踪 · 每日更新</div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="ctrl">
  <div class="wrap">
    <div class="tabs">
      <button class="tab on" data-v="radar">📡 最新雷达（近7天）</button>
      <button class="tab" data-v="lib">📚 近三年论文库</button>
      <button class="tab" data-v="about">ℹ️ 使用与部署</button>
    </div>
    <button class="flt-toggle" id="fltToggle" type="button">🔍 搜索与筛选 <span id="fltArrow">▾</span></button>
    <div class="filters" id="filters">
      <input type="text" id="q" placeholder="搜索标题 / 作者 / 中文标签 / DOI …">
      <select id="tierSel">
        <option value="">全部相关度</option>
        <option value="3">★★★ 强相关</option>
        <option value="2">★★ 及以上</option>
        <option value="1">★ 及以上</option>
      </select>
      <select id="sortSel">
        <option value="score">按相关度排序</option>
        <option value="date">按日期排序</option>
      </select>
    </div>
    <div class="jchips" id="jchips"></div>
    <div class="count-line" id="countline"></div>
  </div>
</div>

<div class="wrap">
  <div id="view-radar">
    <div class="trend" id="trendBox"></div>
    <div id="list-radar"></div>
    <div class="pager" id="pager-radar"></div>
  </div>
  <div id="view-lib" class="hidden">
    <div id="list-lib"></div>
    <div class="pager" id="pager-lib"></div>
  </div>
  <div id="view-about" class="hidden about"></div>
</div>

<footer>
  <div>📡 数据源：Europe PMC · 相关性打分为关键词规则引擎（可自定义） · 页面由 <code>scripts/paper_radar.py</code> 自动生成</div>
  <div style="margin-top:6px">✉️ 作者：<a href="mailto:huangzc@jxust.edu.cn">huangzc@jxust.edu.cn</a></div>
</footer>

<button class="backtop" id="backtop" title="回到顶部">⬆</button>

<button id="selbtn" class="selbtn hidden">🔍 搜索选中内容</button>

<div id="srch" class="srch hidden">
  <div class="srch-box">
    <div class="srch-head">
      <input id="sq" type="text" placeholder="输入关键词搜索（回车确认）">
      <button class="lbtn" onclick="runSearch()">🔍 搜本库</button>
      <button class="lbtn" onclick="closeSearch()">✕</button>
    </div>
    <div class="ext-row">
      <b>直达数据库：</b>
      <button class="lbtn" onclick="extSearch('pubmed')">PubMed</button>
      <button class="lbtn" onclick="extSearch('scholar')">Google Scholar</button>
      <button class="lbtn" onclick="extSearch('epmc')">Europe PMC</button>
      <button class="lbtn" onclick="extSearch('s2')">Semantic Scholar</button>
    </div>
    <div class="srch-res" id="sres"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =================== 配置 =================== */
var JOURNALS = {
  "PNAS":{name:"PNAS",color:"#205493",jif:9.5,q:"1区Top"},
  "PC":{name:"The Plant Cell",color:"#a4262c",jif:13.5,q:"1区Top"},
  "NP":{name:"Nature Plants",color:"#3d8f5f",jif:15.0,q:"1区Top"},
  "MP":{name:"Molecular Plant",color:"#7a4fa0",jif:32.7,q:"1区Top"},
  "New Phytol":{name:"New Phytologist",color:"#b8860b",jif:8.7,q:"1区"},
  "JIPB":{name:"J Integrative Plant Biology",color:"#c05621",jif:12.5,q:"1区Top"},
  "Plant J":{name:"The Plant Journal",color:"#1f7a8c",jif:6.2,q:"1区Top"},
  "JXB":{name:"J Experimental Botany",color:"#6b4f2a",jif:6.5,q:"2区"},
  "Plant Physiol":{name:"Plant Physiology",color:"#2e8b57",jif:8.2,q:"1区Top"},
  "Plant Commun":{name:"Plant Communications",color:"#ef6c00",jif:13.7,q:"1区"},
  "Cell Res":{name:"Cell Research",color:"#c2185b",jif:31.3,q:"1区Top"},
  "Annu Rev Plant Biol":{name:"Annu Rev Plant Biology",color:"#5d4037",jif:26.4,q:"1区Top"},
  "Trends Plant Sci":{name:"Trends in Plant Science",color:"#004d40",jif:21.2,q:"1区Top"},
  "Nature":{name:"Nature",color:"#37474f",jif:56.1,q:"1区Top"},
  "Science":{name:"Science",color:"#b71c1c",jif:47.3,q:"1区Top"},
  "Cell":{name:"Cell",color:"#1565c0",jif:45.1,q:"1区Top"},
  "Nat Commun":{name:"Nature Communications",color:"#00838f",jif:18.1,q:"1区"},
  "Sci Adv":{name:"Science Advances",color:"#6a1b9a",jif:13.9,q:"1区"},
  "Cell Rep":{name:"Cell Reports",color:"#283593",jif:7.7,q:"1区"},
  "eLife":{name:"eLife",color:"#ad1457",jif:-1,q:"2区"},
  "Curr Biol":{name:"Current Biology",color:"#f57f17",jif:7.7,q:"1区"},
  "Dev Cell":{name:"Developmental Cell",color:"#00695c",jif:9.2,q:"1区Top"},
  "Cell Host Microbe":{name:"Cell Host & Microbe",color:"#7b1fa2",jif:23.2,q:"1区Top"},
  "Nat Genet":{name:"Nature Genetics",color:"#d84315",jif:25.5,q:"1区Top"},
  "Nat Biotechnol":{name:"Nature Biotechnology",color:"#558b2f",jif:44.5,q:"1区Top"},
  "Nat Chem Biol":{name:"Nature Chemical Biology",color:"#00897b",jif:15.8,q:"1区Top"},
  "Nat Ecol Evol":{name:"Nature Ecology & Evolution",color:"#33691e",jif:14.5,q:"1区Top"},
  "Nat Microbiol":{name:"Nature Microbiology",color:"#455a64",jif:18.7,q:"1区Top"},
  "Nat Cell Biol":{name:"Nature Cell Biology",color:"#8e24aa",jif:22.7,q:"1区Top"},
  "EMBO J":{name:"The EMBO Journal",color:"#e64a19",jif:8.4,q:"1区Top"},
  "Sci Signal":{name:"Science Signaling",color:"#5e35b1",jif:6.6,q:"2区"}
};
function jmetaHTML(k){
  var j=JOURNALS[k];if(!j)return "";
  var tip="IF=2025年度（JCR 2025，2026.6.17发布）· 分区=中科院2025升级版（2025.3）/新锐2026";
  if(j.jif>0)return '<span class="jmeta" title="'+tip+'">IF '+j.jif+" · "+esc(j.q)+"</span>";
  return '<span class="jmeta" title="'+tip+'（该刊2025年度IF暂缺'+(k==="eLife"?"，eLife已取消影响因子":"")+'）">'+esc(j.q)+"</span>";
}
var FULL_MODE = ["PNAS","PC","NP","MP","New Phytol","JIPB","Plant J","JXB","Plant Physiol","Plant Commun","Cell Res","Annu Rev Plant Biol","Trends Plant Sci"];

/* =================== 工具 =================== */
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity=0;},2200);}
function debounce(fn,ms){var h;return function(){clearTimeout(h);var a=arguments,c=this;h=setTimeout(function(){fn.apply(c,a);},ms);};}
function daysAgo(dateStr,n){var d=new Date(dateStr+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-n);return d.toISOString().slice(0,10);}

/* =================== 年度分片懒加载 =================== */
function loadFull(year,cb){
  if(fullCache[year]) return cb(fullCache[year]);
  if(fullLoading[year]) return fullLoading[year].push(cb);
  fullLoading[year]=[cb];
  var s=document.createElement("script");
  s.src="data/full_"+year+".js";
  s.onload=function(){
    fullCache[year]=window.RADAR_FULL[year]||{};
    var cbs=fullLoading[year];delete fullLoading[year];
    cbs.forEach(function(f){f(fullCache[year]);});
  };
  s.onerror=function(){
    fullCache[year]={};
    var cbs=fullLoading[year];delete fullLoading[year];
    toast("加载摘要分片失败："+year);
    cbs.forEach(function(f){f({});});
  };
  document.head.appendChild(s);
}

/* =================== 翻译引擎（免费公共接口，三源自动fallback + 本地缓存） =================== */
function chunkText(t,max){
  var s=String(t||"").replace(/([.!?])\s+/g,"$1\u0001").split("\u0001");
  var out=[],cur="";
  for(var i=0;i<s.length;i++){
    var seg=s[i].trim(); if(!seg)continue;
    if((cur+" "+seg).length>max&&cur){out.push(cur);cur=seg;}
    else cur=cur?cur+" "+seg:seg;
    while(cur.length>max){out.push(cur.slice(0,max));cur=cur.slice(max);} // 超长兜底
  }
  if(cur)out.push(cur);
  return out;
}
function trLibre(text,cb){
  fetch("https://translate.disroot.org/translate",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({q:text,source:"en",target:"zh"})})
    .then(function(r){return r.json();})
    .then(function(d){(d&&d.translatedText)?cb(null,d.translatedText):cb(1);})
    .catch(function(){cb(1);});
}
function trGoogle(text,cb){
  fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q="+encodeURIComponent(text))
    .then(function(r){return r.json();})
    .then(function(d){cb(null,(d[0]||[]).map(function(x){return x[0];}).join(""));})
    .catch(function(){cb(1);});
}
function trMymem(text,cb){
  var chunks=chunkText(text,450),out=[],todo=chunks.length,failed=false;
  if(!todo)return cb(1);
  chunks.forEach(function(c,i){
    fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(c)+"&langpair=en|zh-CN")
      .then(function(r){return r.json();})
      .then(function(d){out[i]=((d||{}).responseData||{}).translatedText||"";
        if(--todo===0&&!failed)cb(null,out.join(" "));})
      .catch(function(){if(!failed){failed=true;cb(1);}});
  });
}
var TR_PROVIDERS=[trLibre,trGoogle,trMymem];
function translateText(text,cb){
  var i=0;
  (function next(){
    if(i>=TR_PROVIDERS.length)return cb(1,null);
    TR_PROVIDERS[i++](text,function(err,res){
      if(!err&&res)cb(null,res);else next();
    });
  })();
}
function trHTML(r){
  return (r.ti?'<div class="tr-ti"><b>🇨🇳 中文标题：</b>'+esc(r.ti)+"</div>":"")
       +(r.ab?'<div class="tr-ab"><b>中文摘要：</b>'+esc(r.ab)+"</div>":"");
}
window.toggleTr=function(cid,year,id){
  var el=document.getElementById("tr-"+cid);if(!el)return;
  el.classList.toggle("hidden");
  if(el.classList.contains("hidden")||el.dataset.done)return;
  var p=ID2P[id];
  if(!p){el.innerHTML="未找到记录";el.dataset.done=1;return;}
  var ck="tr:"+id,cached=null;
  try{cached=JSON.parse(localStorage.getItem(ck)||"null");}catch(e){}
  if(cached&&(cached.ti||cached.ab)){el.innerHTML=trHTML(cached);el.dataset.done=1;return;}
  el.innerHTML='<div class="loading">🌐 翻译中…（首次约 3~10 秒，结果会缓存到本机）</div>';
  getFull(year,id,function(f){
    var ab=(f&&f.ab)?f.ab:"";
    var done=0,need=2,r={};
    var finish=function(){
      if(done<need)return;
      if(!r.ti&&!r.ab){el.innerHTML='<div class="loading">翻译服务暂时不可用（免费公共接口限流），请稍后重试；正式部署后可在脚本中改用你自己的翻译/LLM接口。</div>';el.dataset.done=1;return;}
      try{localStorage.setItem(ck,JSON.stringify(r));}catch(e){}
      el.innerHTML=trHTML(r);el.dataset.done=1;
    };
    translateText(p.ti,function(e,t){if(!e&&t)r.ti=t;done++;finish();});
    if(ab)translateText(ab,function(e,t){if(!e&&t)r.ab=t;done++;finish();});
    else{need=1;}
  });
};

/* =================== 过滤与排序 =================== */
function filterPapers(daysLimit){
  var base = META.papers;
  var q = state.q.trim().toLowerCase();
  var latest = META.stats.latest;
  var cut = daysLimit? daysAgo(latest,6) : "";
  var out=[];
  for(var i=0;i<base.length;i++){
    var p=base[i];
    if(cut && p.da<cut) continue;
    if(!state.journals[p.jo]) continue;
    if(state.tier && p.tr< +state.tier) continue;
    if(q){
      var hay=(p.ti+" "+p.au+" "+p.tg.join(" ")+" "+p.doi+" "+JOURNALS[p.jo].name).toLowerCase();
      if(hay.indexOf(q)<0) continue;
    }
    out.push(p);
  }
  if(state.sort==="score") out.sort(function(a,b){return b.sc-a.sc || b.da.localeCompare(a.da);});
  else out.sort(function(a,b){return b.da.localeCompare(a.da) || b.sc-a.sc;});
  return out;
}

    +'<button class="lbtn" onclick="toggleAbs(\''+cssId(p.i)+'\',\''+p.da.slice(0,4)+'\',\''+esc(p.i)+'\')">📄 摘要</button>'

/* =================== 列表与分页 =================== */
function renderList(viewId,pagerId,papers,page){
  var box=document.getElementById(viewId), pg=document.getElementById(pagerId);
  var total=papers.length;
  if(!total){box.innerHTML='<div class="empty">没有符合条件的论文 —— 试试放宽相关度或清空搜索词</div>';pg.innerHTML="";return;}
  var pages=Math.ceil(total/PAGE_SIZE);
  if(page>pages)page=pages;
  var start=(page-1)*PAGE_SIZE, slice=papers.slice(start,start+PAGE_SIZE);
  box.innerHTML=slice.map(cardHTML).join("");
  if(pages>1){
    var h="",lo=Math.max(1,page-3),hi=Math.min(pages,page+3);
    if(page>1)h+='<button class="pg" data-p="'+(page-1)+'">‹ 上一页</button>';
    if(lo>1)h+='<button class="pg" data-p="1">1</button><span class="pg" style="border:none;background:none">…</span>';
    for(var i=lo;i<=hi;i++)h+='<button class="pg'+(i===page?" on":"")+'" data-p="'+i+'">'+i+"</button>";
    if(hi<pages)h+='<span class="pg" style="border:none;background:none">…</span><button class="pg" data-p="'+pages+'">'+pages+"</button>";
    if(page<pages)h+='<button class="pg" data-p="'+(page+1)+'">下一页 ›</button>';
    pg.innerHTML=h;
    pg.querySelectorAll(".pg[data-p]").forEach(function(b){
      b.onclick=function(){
        var np=+b.dataset.p;
        if(viewId==="list-radar"){state.pageR=np;renderRadar();}else{state.pageL=np;renderLib();}
        window.scrollTo({top:0,behavior:"smooth"});
      };
    });
  }else pg.innerHTML="";
  document.getElementById("countline").textContent="共 "+total+" 篇"+(total>META.stats.total?"":"（库总收录 "+META.stats.total+" 篇）");
}

  +"<pre>name: daily-update\non:\n  schedule:\n    - cron: '50 22 * * *'   # UTC 22:50 = 北京时间 6:50\n  workflow_dispatch:\npermissions:\n  contents: write\njobs:\n  update:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - run: pip install requests   # 可选\n      - run: python scripts/paper_radar.py daily\n      - run: |\n          git config user.name radar-bot\n          git config user.email bot@users.noreply.github.com\n          git add -A\n          git commit -m \"daily update $(date +%F)\" || true\n          git push</pre>"
  +"<h3>本地更新</h3>"
  +"<pre>python3 scripts/paper_radar.py daily   # 增量抓最近10天并重建\npython3 scripts/paper_radar.py full --refetch   # 全量重抓</pre>"
  +"<h3>改成你自己的方向</h3>"
  +"<p>编辑 <code>scripts/paper_radar.py</code> 顶部的 <code>JOURNALS</code>（期刊 ISSN 列表）与 <code>TERMS</code>（关键词与分值）即可迁移到任何领域；关键词命中即计分，全部为正则规则，透明可控。</p>"
  +"<h3>进阶玩法</h3>"
  +"<p>「🌐 中译」使用免费公共接口，适合个人日常使用；如需更高质量译文，可在 <code>daily</code> 流程后接入大模型 API 批量翻译并回写 <code>data/full_*.js</code>，页面无需改动。其他可扩展方向：邮件推送每日 ★★★ 论文、公众号精选分发、添加更多期刊（改 <code>scripts/paper_radar.py</code> 的 <code>JOURNALS</code> 即可）。</p>"
  +"<h3>联系作者</h3>"

}

/* =================== 事件与初始化 =================== */
function refresh(){
  if(state.view==="radar")renderRadar();
  else if(state.view==="lib")renderLib();
}
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});
    t.classList.add("on");
    state.view=t.dataset.v;
    document.getElementById("view-radar").classList.toggle("hidden",state.view!=="radar");
    document.getElementById("view-lib").classList.toggle("hidden",state.view!=="lib");
    document.getElementById("view-about").classList.toggle("hidden",state.view!=="about");
    document.getElementById("filters").classList.toggle("hidden",state.view==="about");
    document.getElementById("jchips").classList.toggle("hidden",state.view==="about");
    document.getElementById("countline").classList.toggle("hidden",state.view==="about");
    refresh();
  };
});
document.getElementById("q").addEventListener("input",debounce(function(e){
  state.q=e.target.value;state.pageR=1;state.pageL=1;refresh();
},180));
document.getElementById("tierSel").onchange=function(e){state.tier=e.target.value;state.pageR=1;state.pageL=1;refresh();};
document.getElementById("sortSel").onchange=function(e){state.sort=e.target.value;refresh();};

/* =================== 沉浸式滚动：下滑隐藏控制条，上滑浮现 =================== */
var _lastY=0,_ctrlBar=document.querySelector(".ctrl"),_backBtn=document.getElementById("backtop");
window.addEventListener("scroll",function(){
  var y=window.scrollY||document.documentElement.scrollTop||0;
  if(y>150&&y>_lastY+4)_ctrlBar.classList.add("hide");
  else if(y<_lastY-4||y<150)_ctrlBar.classList.remove("hide");
  if(_backBtn){if(y>600)_backBtn.classList.add("show");else _backBtn.classList.remove("show");}
  _lastY=y;
},{passive:true});
_backBtn.onclick=function(){window.scrollTo({top:0,behavior:"smooth"});};

/* =================== 手机端：搜索/筛选折叠切换 =================== */
var _fltToggle=document.getElementById("fltToggle"),_fltArrow=document.getElementById("fltArrow");
if(_fltToggle){
  _fltToggle.addEventListener("click",function(e){
    e.stopPropagation();
    var f=document.getElementById("filters");
    var isOpen=f.classList.toggle("open");
    _fltArrow.textContent=isOpen?"▴":"▾";
    if(isOpen){document.getElementById("q").focus();}
  });
  // 切换视图时同步折叠状态
  document.querySelectorAll(".tab[data-v]").forEach(function(t){
    t.addEventListener("click",function(){
      var f=document.getElementById("filters");
      f.classList.remove("open");_fltArrow.textContent="▾";
    });
  });
}

/* =================== 划词快搜：选中文字 -> 浮动按钮 -> 弹出搜索（不打断阅读） =================== */
var _selBtn=document.getElementById("selbtn"),_srch=document.getElementById("srch"),
    _sq=document.getElementById("sq"),_sres=document.getElementById("sres"),_sqToken=0;
document.addEventListener("mouseup",function(e){
  if(_selBtn.contains(e.target))return;
  _showSelBtn();
});
document.addEventListener("touchend",function(e){
  setTimeout(_showSelBtn,80);
});
function _showSelBtn(){
  var sel=window.getSelection(),txt=(sel?String(sel):"").trim();
  if(!sel||!sel.rangeCount||txt.length<2||txt.length>120){_selBtn.classList.add("hidden");return;}
  var r=sel.getRangeAt(0).getBoundingClientRect();
  if(!r||(!r.top&&!r.left&&r.width===0)){_selBtn.classList.add("hidden");return;}
  _selBtn.style.left=Math.max(8,Math.min(window.innerWidth-170,r.left))+"px";
  _selBtn.style.top=Math.max(8,Math.min(window.innerHeight-46,r.bottom+7))+"px";
  _selBtn.classList.remove("hidden");
}
_selBtn.addEventListener("mousedown",function(e){e.preventDefault();});
_selBtn.onclick=function(){
  var sel=window.getSelection(),txt=(sel?String(sel):"").trim();
  _selBtn.classList.add("hidden");
  openSearch(txt);
};
window.openSearch=function(q){
  if(q!==undefined&&q!==null)_sq.value=q;
  _srch.classList.remove("hidden");
  document.body.style.overflow="hidden";   /* 冻结背景滚动，保持阅读位置 */
  setTimeout(function(){_sq.focus();},50);
  runSearch();
};
window.closeSearch=function(){
  _srch.classList.add("hidden");
  document.body.style.overflow="";
};
_srch.addEventListener("mousedown",function(e){if(e.target===_srch)closeSearch();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!_srch.classList.contains("hidden"))closeSearch();});
_sq.addEventListener("keydown",function(e){if(e.key==="Enter")runSearch();});
window.extSearch=function(db){
  var q=_sq.value.trim();if(!q)return toast("请先输入关键词");
  var map={
    pubmed:"https://pubmed.ncbi.nlm.nih.gov/?term=",
    scholar:"https://scholar.google.com/scholar?q=",
    epmc:"https://europepmc.org/search?query=",
    s2:"https://www.semanticscholar.org/search?q="
  };
  window.open(map[db]+encodeURIComponent(q),"_blank","noopener");
};
function metaMatch(q){
  var out=[],pq=q.toLowerCase();
  for(var i=0;i<META.papers.length&&out.length<400;i++){
    var p=META.papers[i];
    var hay=(p.ti+" "+p.au+" "+p.tg.join(" ")+" "+p.doi).toLowerCase();
    if(hay.indexOf(pq)>=0)out.push(p);
  }
  out.sort(function(a,b){return b.sc-a.sc||b.da.localeCompare(a.da);});
  return out;
}
function deepMatch(q,seen){
  var pq=q.toLowerCase(),out=[];
  var full=window.RADAR_FULL||{};
  for(var y in full){
    var yr=full[y];
    for(var id in yr){
      var f=yr[id];
      if(f.ab&&f.ab.toLowerCase().indexOf(pq)>=0&&!seen[id]){
        var p=ID2P[id];
        if(p){seen[id]=1;out.push(p);}
      }
    }
  }
  return out;
}
function miniCard(p){
  var j=JOURNALS[p.jo]||{name:p.jo,color:"#888"};
  return '<div class="mcard"><span class="badge" style="background:'+j.color+'">'+esc(p.jo)+"</span>"+jmetaHTML(p.jo)
    +'<span class="mdate">'+esc(p.da)+"</span>"
    +'<span class="stars t'+p.tr+'">'+TIER_TXT[p.tr]+"</span>"
    +'<a class="mti" href="'+(p.doi?"https://doi.org/"+esc(p.doi):"#")+'" target="_blank" rel="noopener">'+esc(p.ti)+"</a>"
    +'<div class="mau">'+esc(p.au)+"</div></div>";
}
function renderSrch(q,list,note){
  var h="";
  if(!q)h='<div class="empty">输入关键词，或在页面上划选一段文字后点「🔍 搜索选中内容」<br>也可以直接用上方按钮直达 PubMed / Google Scholar 等数据库</div>';
  else if(!list.length)h='<div class="empty">本库暂无匹配——试试上方直达按钮去 PubMed 全库检索</div>'+(note?'<div class="loading">'+note+"</div>":"");
  else h=list.map(miniCard).join("")+(note?'<div class="loading">'+note+"</div>":"");
  _sres.innerHTML=h;
}
window.runSearch=function(){
  var q=_sq.value.trim(),token=++_sqToken;
  if(!q){renderSrch("",[]);return;}
  var base=metaMatch(q).slice(0,30),seen={};
  base.forEach(function(p){seen[p.i]=1;});
  renderSrch(q,base,"⏳ 正在深度检索三年库全文摘要（首次约需数秒）…");
  var pending=["2023","2024","2025","2026"].filter(function(y){return !(window.RADAR_FULL&&window.RADAR_FULL[y]);});
  if(!pending.length){
    renderSrch(q,base.concat(deepMatch(q,seen)).slice(0,40));
    return;
  }
  var done=0;
  pending.forEach(function(y){
    loadFull(y,function(){
      if(token!==_sqToken)return;
      if(++done===pending.length)
        renderSrch(q,base.concat(deepMatch(q,seen)).slice(0,40));
    });
  });
};

function boot(){
  try{
    META=window.RADAR_META;
    UNITS=window.RADAR_UNITS||{};
    FIGS=window.RADAR_FIGS||{};
    (META.papers||[]).forEach(function(p){ID2P[p.i]=p;});
    renderStats();renderJchips();renderTrend();renderRadar();renderAbout();
  }catch(e){
    document.getElementById("countline").textContent="数据加载失败："+e.message;
  }
}
</script>
<script src="data/meta.js"></script>
<script>boot();</script>
